<div id="ClassicTVConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-controller="__plugin/classictvjs">
  <style>
      /* -----------------------------------------------------------------------
         Classic TV Channel Management — Broadcast CRT Theme
         Aligned with Classic TV web UI design tokens.
      ----------------------------------------------------------------------- */
      #ClassicTVConfigPage {
        --ctv-bg: #07090b;
        --ctv-card: #121619;
        --ctv-card-hover: #181e22;
        --ctv-border: rgba(255, 255, 255, 0.12);
        --ctv-border-strong: rgba(255, 255, 255, 0.24);
        --ctv-text: #eef2f3;
        --ctv-muted: #8b989d;
        --ctv-phosphor: #46ff7a;
        --ctv-phosphor-dim: rgba(70, 255, 122, 0.14);
        --ctv-phosphor-border: rgba(70, 255, 122, 0.4);
        --ctv-err: #ff6b6b;
        --ctv-warn: #ffaa44;
      }

      #ClassicTVConfigPage .content-primary h2 {
        font-family: "Courier New", Courier, monospace;
        letter-spacing: 0.06em;
        color: var(--ctv-phosphor);
        text-transform: uppercase;
        margin-bottom: 0.9em;
      }

      /* Channel card */
      .ctv-channel-card {
        background: var(--ctv-card, #121619);
        color: var(--ctv-text, #eef2f3);
        border: 1px solid var(--ctv-border, rgba(255, 255, 255, 0.12));
        padding: 1.1em 1.2em;
        margin-bottom: 0.85em;
        border-radius: 10px;
        transition: background 120ms ease, border-color 120ms ease;
      }

      .ctv-channel-card:hover {
        background: var(--ctv-card-hover, #181e22);
        border-color: var(--ctv-border-strong, rgba(255, 255, 255, 0.24));
      }

      .ctv-channel-card-header {
        display: flex;
        align-items: baseline;
        gap: 0.65em;
        margin-bottom: 0.4em;
        flex-wrap: wrap;
      }

      .ctv-channel-card-title {
        font-size: 1.08em;
        font-weight: 700;
        margin: 0;
      }

      .ctv-channel-card-number {
        font-family: "Courier New", Courier, monospace;
        font-size: 0.88em;
        font-weight: 700;
        color: var(--ctv-phosphor, #46ff7a);
      }

      .ctv-channel-card-actions {
        display: flex;
        gap: 0.5em;
        margin-top: 0.75em;
        flex-wrap: wrap;
      }

      .ctv-channel-card-blocks {
        font-size: 0.85em;
        color: var(--ctv-muted, #8b989d);
        margin-top: 0.35em;
      }

      .ctv-enabled-badge {
        display: inline-block;
        font-size: 0.74em;
        font-weight: 600;
        padding: 0.15em 0.55em;
        border-radius: 999px;
        background: var(--ctv-phosphor-dim, rgba(70, 255, 122, 0.14));
        color: var(--ctv-phosphor, #46ff7a);
        border: 1px solid var(--ctv-phosphor-border, rgba(70, 255, 122, 0.4));
      }

      .ctv-enabled-badge.disabled {
        background: rgba(158, 158, 158, 0.14);
        color: var(--ctv-muted, #8b989d);
        border-color: rgba(158, 158, 158, 0.3);
      }

      /* Modal overlay */
      .ctv-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(5, 7, 9, 0.78);
        backdrop-filter: blur(6px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Modal panel */
      .ctv-modal {
        background: var(--ctv-card, #121619);
        color: var(--ctv-text, #eef2f3);
        border: 1px solid var(--ctv-border-strong, rgba(255, 255, 255, 0.22));
        padding: 1.5em;
        border-radius: 12px;
        max-width: 760px;
        width: 92%;
        max-height: 88vh;
        overflow-y: auto;
        box-sizing: border-box;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.72);
      }

      /* Offline block styling */
      .ctv-block-offline {
        opacity: 0.5;
      }

      .ctv-block-offline .ctv-block-header::after {
        content: ' [Offline]';
        font-size: 0.8em;
        color: var(--text-color-secondary, #aaa);
      }

      /* Error and warning text */
      .ctv-error {
        color: var(--color-red, #e53935);
        font-size: 0.875em;
      }

      .ctv-warning {
        color: var(--color-yellow, #f9a825);
        font-size: 0.875em;
      }

      /* Reorder buttons (Move Up / Move Down) */
      .btn-reorder {
        padding: 0.2em 0.5em;
        font-size: 0.8em;
        cursor: pointer;
      }

      .btn-reorder:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /* Error banner (page-level) */
      #ctv-error-banner {
        background: rgba(229, 57, 53, 0.12);
        border: 1px solid rgba(229, 57, 53, 0.4);
        color: var(--color-red, #e53935);
        padding: 0.75em 1em;
        border-radius: 4px;
        margin-bottom: 1em;
      }

      /* Validation error list inside editor */
      #ctv-validation-errors {
        margin-bottom: 0.75em;
      }

      #ctv-validation-errors ul {
        margin: 0.25em 0 0 1.25em;
        padding: 0;
      }

      #ctv-validation-errors li {
        font-size: 0.875em;
        color: var(--color-red, #e53935);
        margin-bottom: 0.2em;
      }

      /* Form layout helpers */
      .ctv-form-row {
        margin-bottom: 0.75em;
        display: flex;
        flex-direction: column;
        gap: 0.25em;
      }

      .ctv-form-row label {
        font-size: 0.875em;
        color: var(--text-color-secondary, #aaa);
      }

      .ctv-form-row input[type="text"],
      .ctv-form-row input[type="number"],
      .ctv-form-row select {
        background: rgba(255, 255, 255, 0.07);
        color: var(--theme-text-color, #fff);
        border: 1px solid var(--divider-color, #444);
        border-radius: 3px;
        padding: 0.4em 0.6em;
        font-size: 0.95em;
        max-width: 360px;
        box-sizing: border-box;
      }

      .ctv-form-row input[type="text"]:focus,
      .ctv-form-row input[type="number"]:focus,
      .ctv-form-row select:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.4);
      }

      .ctv-form-inline {
        display: flex;
        align-items: center;
        gap: 0.5em;
      }

      /* Block list */
      #ctv-block-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #ctv-block-list li {
        border: 1px solid var(--divider-color, #333);
        border-radius: 4px;
        margin-bottom: 0.5em;
        background: rgba(255, 255, 255, 0.03);
      }

      .ctv-block-header {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.5em 0.75em;
        flex-wrap: wrap;
      }

      .ctv-block-header-title {
        flex: 1;
        font-weight: 500;
      }

      .ctv-block-body {
        padding: 0 0.75em 0.75em;
        border-top: 1px solid var(--divider-color, #333);
      }

      /* Show list within a block */
      .ctv-show-list {
        list-style: none;
        margin: 0.5em 0 0;
        padding: 0;
      }

      .ctv-show-list li {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.3em 0;
        border-bottom: 1px solid var(--divider-color, #222);
        flex-wrap: wrap;
        font-size: 0.9em;
      }

      .ctv-show-list li:last-child {
        border-bottom: none;
      }

      .ctv-show-name {
        flex: 1;
        min-width: 120px;
      }

      /* Series picker search input */
      #ctv-series-search {
        background: rgba(255, 255, 255, 0.07);
        color: var(--theme-text-color, #fff);
        border: 1px solid var(--divider-color, #444);
        border-radius: 3px;
        padding: 0.4em 0.6em;
        font-size: 0.95em;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 0.5em;
      }

      #ctv-series-search:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.4);
      }

      /* Series list in picker */
      #ctv-series-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 320px;
        overflow-y: auto;
      }

      #ctv-series-list li {
        padding: 0.45em 0.6em;
        border-radius: 3px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5em;
        font-size: 0.9em;
      }

      #ctv-series-list li:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      #ctv-series-list li.selected {
        background: rgba(255, 255, 255, 0.14);
      }

      .ctv-series-ep-count {
        font-size: 0.8em;
        color: var(--text-color-secondary, #aaa);
        white-space: nowrap;
      }

      /* Confirm box */
      .ctv-confirm-box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--divider-color, #444);
        border-radius: 4px;
        padding: 0.75em 1em;
        margin-bottom: 0.75em;
      }

      .ctv-confirm-box-actions {
        display: flex;
        gap: 0.5em;
        margin-top: 0.5em;
      }

      /* Modal heading */
      .ctv-modal h2,
      .ctv-modal h3 {
        margin-top: 0;
        font-size: 1.1em;
        font-weight: 600;
      }

      /* Separator */
      .ctv-sep {
        border: none;
        border-top: 1px solid var(--divider-color, #333);
        margin: 1em 0;
      }

      /* Tooltip icon */
      .ctv-tooltip-icon {
        cursor: help;
        font-size: 0.85em;
        color: var(--text-color-secondary, #aaa);
      }

      /* Special mode & status badges */
      .ctv-mode-badge {
        display: inline-block;
        font-size: 0.75em;
        padding: 0.15em 0.45em;
        border-radius: 3px;
        background: rgba(33, 150, 243, 0.18);
        color: #64b5f6;
        border: 1px solid rgba(33, 150, 243, 0.35);
      }

      .ctv-now-playing {
        font-size: 0.82em;
        color: var(--text-color-secondary, #aaa);
        margin-top: 0.35em;
      }

      .ctv-now-playing strong {
        color: #81c784;
        font-weight: 500;
      }

      /* Save toast banner */
      .ctv-save-toast {
        background: rgba(76, 175, 80, 0.14);
        border: 1px solid rgba(76, 175, 80, 0.45);
        color: #81c784;
        padding: 0.65em 1em;
        border-radius: 4px;
        margin-bottom: 1em;
        font-size: 0.9em;
      }

      /* 24-hour block timeline */
      .ctv-timeline-wrap {
        margin-bottom: 0.75em;
      }

      .ctv-timeline {
        position: relative;
        height: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--divider-color, #444);
        border-radius: 3px;
        overflow: hidden;
      }

      .ctv-timeline-seg {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(76, 175, 80, 0.45);
        border-right: 1px solid rgba(0, 0, 0, 0.4);
        font-size: 0.7em;
        line-height: 20px;
        padding: 0 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #fff;
        box-sizing: border-box;
      }

      .ctv-timeline-seg.offline {
        background: rgba(158, 158, 158, 0.25);
        color: var(--text-color-secondary, #aaa);
      }

      .ctv-timeline-seg.overlap {
        background: rgba(229, 57, 53, 0.65);
      }

      .ctv-timeline-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.72em;
        color: var(--text-color-secondary, #aaa);
        margin-top: 2px;
      }

      /* Bulk show actions & season filter */
      .ctv-bulk-bar {
        display: flex;
        gap: 0.35em;
        flex-wrap: wrap;
        align-items: center;
      }

      .ctv-btn-xs {
        padding: 0.2em 0.5em !important;
        font-size: 0.78em !important;
      }

      .ctv-season-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        margin-top: 0.35em;
        align-items: center;
      }

      .ctv-season-bar label {
        display: inline-flex;
        align-items: center;
        gap: 0.25em;
        cursor: pointer;
        font-size: 0.85em;
        color: var(--theme-text-color, #eee);
      }

      /* Responsive: on very narrow viewports, stack modal actions */
      @media (max-width: 480px) {
        .ctv-channel-card-actions {
          flex-direction: column;
        }
        .ctv-modal {
          padding: 1em;
        }
      }
  </style>
  <div data-role="content">
    <div class="content-primary">

      <h2>Classic TV — Channels</h2>

      <!-- Page-level error banner (hidden until an error occurs) -->
      <div id="ctv-error-banner" style="display:none"></div>
      <div id="ctv-save-toast" class="ctv-save-toast" style="display:none"></div>

      <button id="ctv-btn-new-channel" class="raised button-submit">+ New Channel</button>

      <!-- Channel card list — populated by JS -->
      <div id="ctv-channel-list"></div>

    </div>
  </div>

  <!-- -----------------------------------------------------------------------
       Channel editor modal
       Rendered by JS into #ctv-editor-content.
  ----------------------------------------------------------------------- -->
  <div id="ctv-editor-overlay" class="ctv-modal-overlay" style="display:none">
    <div class="ctv-modal">
      <div id="ctv-editor-content"><!-- rendered by JS --></div>
    </div>
  </div>

  <!-- -----------------------------------------------------------------------
       Series picker modal
       Rendered by JS into #ctv-series-content.
  ----------------------------------------------------------------------- -->
  <div id="ctv-series-overlay" class="ctv-modal-overlay" style="display:none">
    <div class="ctv-modal">
      <div id="ctv-series-content"><!-- rendered by JS --></div>
    </div>
  </div>

</div>
